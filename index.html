<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Làm sạch Content</title>
    <style>
        body{font-family:Arial,sans-serif;background-color:#f4f7f6;padding:20px;max-width:800px;margin:auto;user-select:none;-webkit-user-select:none;}
        h2{text-align:center;color:#333;}
        .container{background:#fff;padding:20px;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.1);}
        textarea{width:100%;height:300px;padding:15px;border:2px solid #ddd;border-radius:5px;font-size:16px;resize:vertical;box-sizing:border-box;line-height:1.6;}
        textarea:focus{border-color:#007cba;outline:none;}
        .btn-group{display:flex;justify-content:space-between;margin-top:15px;}
        button{padding:10px 20px;font-size:16px;border:none;border-radius:5px;cursor:pointer;font-weight:bold;transition:0.3s;}
        .btn-copy{background-color:#007cba;color:white;}
        .btn-copy:hover{background-color:#005a87;}
        .btn-clear{background-color:#dc3232;color:white;}
        .btn-clear:hover{background-color:#a42828;}
        #status{text-align:center;margin-top:15px;color:green;font-weight:bold;min-height:20px;}
        
        /* CSS cho phần Bản quyền */
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }
        .footer a {
            color: #007cba;
            text-decoration: none;
            font-weight: bold;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h2>Làm sạch Code & Chuẩn hóa Dòng</h2>
    <div class="container">
        <p><i>Hướng dẫn: Paste (Ctrl+V) bài viết vào ô bên dưới. Tool sẽ tự động làm sạch code ẩn và căn chỉnh dòng chuẩn.</i></p>
        <textarea id="contentBox" placeholder="Paste nội dung vào đây..."></textarea>
        <div class="btn-group">
            <button class="btn-clear" id="b1">Xóa trắng</button>
            <button class="btn-copy" id="b2">Copy để dán vào WP</button>
        </div>
        <div id="status"></div>
    </div>

    <!-- Phần Bản quyền -->
