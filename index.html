<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Làm sạch Content - UnipharHub</title>
    <style>
        body{font-family:Arial,sans-serif;background-color:#f4f7f6;padding:20px;max-width:900px;margin:auto;}
        h2{text-align:center;color:#333;margin-bottom:10px;}
        .container{background:#fff;padding:20px;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.1);}
        textarea{width:100%;height:400px;padding:15px;border:2px solid #ddd;border-radius:5px;font-size:15px;font-family:Consolas,monaco,monospace;resize:vertical;box-sizing:border-box;line-height:1.5;background-color:#fafafa;}
        textarea:focus{border-color:#007cba;outline:none;background-color:#fff;}
        .btn-group{display:flex;justify-content:space-between;margin-top:15px;}
        button{padding:12px 25px;font-size:16px;border:none;border-radius:5px;cursor:pointer;font-weight:bold;transition:0.3s;}
        .btn-copy{background-color:#007cba;color:white;flex-grow:1;margin-left:10px;}
        .btn-copy:hover{background-color:#005a87;}
        .btn-clear{background-color:#dc3232;color:white;}
        .btn-clear:hover{background-color:#a42828;}
        #status{text-align:center;margin-top:15px;color:green;font-weight:bold;min-height:20px;}
        .note{font-size:13px; color:#d63638; margin-bottom:10px; font-weight:bold;}
        .footer{text-align:center;margin-top:25px;font-size:14px;color:#666;}
        .footer a{color:#007cba;text-decoration:none;font-weight:bold;}
    </style>
</head>
<body>
    <h2>Làm sạch Content & Giữ thẻ HTML</h2>
    <div class="container">
        <p class="note">Lưu ý: Sau khi Copy, hãy dán vào tab "VĂN BẢN" (hoặc "MÃ") trong WordPress để giữ định dạng H2, H3, List...</p>
        <textarea id="contentBox" placeholder="Dán nội dung từ ChatGPT, Google Docs vào đây..."></textarea>
        <div class="btn-group">
            <button class="btn-clear" id="btn-clear">Xóa trắng</button>
            <button class="btn-copy" id="btn-copy">Copy mã sạch</button>
        </div>
        <div id="status"></div>
    </div>

    <div class="footer">
        © 2026 UnipharHub • Created by <a href="https://www.facebook.com/lemanhhunghup/" target="_blank">@lehunghup</a>
    </div>

    <script>
        /* --- TÙY CHỌN: CHẶN XEM CODE (Đã tắt - Bỏ dấu // ở đầu để bật lại nếu muốn) --- */
        // document.addEventListener("contextmenu", e => e.preventDefault());
        // document.onkeydown = function(e) { if(123 == e.keyCode || (e.ctrlKey && e.shiftKey && (73 == e.keyCode || 67 == e.keyCode || 74 == e.keyCode)) || (e.ctrlKey && 85 == e.keyCode)) return false; };
        
        /* --- LOGIC LÀM SẠCH VÀ GIỮ THẺ HTML --- */
        const contentBox = document.getElementById("contentBox");

        contentBox.addEventListener("paste", (e) => {
            e.preventDefault();
            
            // Lấy dữ liệu HTML từ clipboard
            let html = e.clipboardData.getData("text/html");
            
            // Nếu copy từ nguồn không có HTML (như Notepad), fallback về text thường
            if (!html) {
                let plainText = e.clipboardData.getData("text/plain");
                contentBox.value = plainText;
                showStatus("Đã dán văn bản thuần túy!", "green");
                return;
            }

            // Tạo DOM ảo để xử lý
            let div = document.createElement('div');
            div.innerHTML = html;

            // Danh sách các thẻ được phép giữ lại (Đã xóa bỏ thẻ 'a' để xóa link)
            const allowedTags = ['h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'p', 'br', 'strong', 'b', 'i', 'em', 'ul', 'ol', 'li'];

            function clean(node) {
                let result = "";
                let children = node.childNodes;

                for (let i = 0; i < children.length; i++) {
                    let child = children[i];
                    
                    if (child.nodeType === 3) { 
                        // Node văn bản (Text node)
                        result += child.textContent;
                    } else if (child.nodeType === 1) { 
                        // Node phần tử (Element node)
                        let tagName = child.tagName.toLowerCase();
                        
                        // Chuẩn hóa thẻ b -> strong, i -> em cho chuẩn SEO WP
                        if (tagName === 'b') tagName = 'strong';
                        if (tagName === 'i') tagName = 'em';

                        let cleanContent = clean(child); // Đệ quy xử lý node con

                        if (allowedTags.includes(tagName)) {
                            // Xử lý riêng cho thẻ rỗng <br> để tránh lỗi <br></br>
                            if (tagName === 'br') {
                                result += `<br />`;
                                continue;
                            }

                            // Căn chỉnh khoảng cách (xuống dòng) cho mã HTML nhìn đẹp mắt hơn
                            if (['p', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'ul', 'ol'].includes(tagName)) {
                                result += `<${tagName}>${cleanContent}</${tagName}>\n\n`;
                            } else if (tagName === 'li') {
                                result += `  <${tagName}>${cleanContent}</${tagName}>\n`;
                            } else {
                                // Các thẻ inline (strong, em)
                                result += `<${tagName}>${cleanContent}</${tagName}>`;
                            }
                        } else {
                            // Nếu thẻ không được phép (bao gồm cả thẻ <a>), loại bỏ thẻ, CHỈ LẤY LẠI CHỮ BÊN TRONG
                            result += cleanContent;
                        }
                    }
                }
                return result;
            }

            let cleaned = clean(div);
            
            // Xóa bỏ khoảng trắng và dòng trống thừa
            cleaned = cleaned.replace(/\n{3,}/g, '\n\n').trim();
            
            contentBox.value = cleaned;
            showStatus("Đã làm sạch, giữ định dạng và xóa toàn bộ link!", "green");
        });

        // Hàm hiển thị thông báo
        function showStatus(message, color) {
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = message; 
            statusDiv.style.color = color;
            if (color === "green") {
                setTimeout(() => statusDiv.innerText = "", 3000);
            }
        }

        // Nút Xóa
        document.getElementById("btn-clear").addEventListener("click", () => { 
            contentBox.value = ""; 
            showStatus("", ""); 
        });

        // Nút Copy
        document.getElementById("btn-copy").addEventListener("click", () => {
            if (contentBox.value) {
                navigator.clipboard.writeText(contentBox.value).then(() => {
                    showStatus("Đã copy thành công!", "green");
                });
            } else {
                showStatus("Không có nội dung để copy!", "red");
            }
        });
    </script>
</body>
</html>
